[package]
name = "sage-data-bridge"
version = "0.1.0"
description = "Sage Data Bridge - SQL Server data extraction tool"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "fs-all", "dialog-all",
  "path-all", "shell-open"
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# SQL Server driver
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "rustls",
  "chrono",
  "time",
  "rust_decimal",
  "winauth",
  "sql-browser-tokio"
] }
tokio-util = { version = "0.7", features = ["compat"] }

# Data types
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Security
argon2 = "0.5"
rand = "0.8"

# Utilities
dirs = "5"
thiserror = "1"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
odbc-api = { version = "17.0.0", default-features = false, features = ["odbc_version_3_80"] }

[profile.dev]
opt-level = 1

[features]
# Used by `tauri build` when the frontend is loaded from the bundled filesystem.
custom-protocol = ["tauri/custom-protocol"]
